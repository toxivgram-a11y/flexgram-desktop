name: FlexGram Windows

on:
  push:
    branches: [ flexgram ]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-2022
    env:
      UPLOAD_ARTIFACT: "true"
    defaults:
      run:
        shell: cmd
        working-directory: ${{ github.workspace }}

    steps:
      - name: Prepare directories.
        run: |
          mkdir %userprofile%\TBuild\Libraries
          mkdir %userprofile%\TBuild\Libraries64
          echo TBUILD=%userprofile%\TBuild>>%GITHUB_ENV%

      - name: Get repository name.
        shell: bash
        run: echo "REPO_NAME=${GITHUB_REPOSITORY##*/}" >> $GITHUB_ENV

      - uses: ilammy/msvc-dev-cmd@v1
        name: Native Tools Command Prompt.
        with:
          arch: x64

      - name: Clone.
        uses: actions/checkout@v4
        with:
          submodules: recursive
          path: ${{ env.TBUILD }}\${{ env.REPO_NAME }}

      - name: Choco installs.
        run: |
          choco install --no-progress -y nasm strawberryperl yasm jom ninja
          py -m pip install pywin32

      - name: Install msys64.
        run: |
          mkdir %TBUILD%\ThirdParty
          xcopy /E /I C:\msys64 %TBUILD%\ThirdParty\msys64

      - name: Set up environment paths.
        shell: bash
        run: |
          echo "C:\\Strawberry\\perl\\bin\\" >> $GITHUB_PATH
          echo "C:\\Program Files\\NASM\\" >> $GITHUB_PATH
          echo "C:\\ProgramData\\chocolatey\\lib\\ninja\\tools\\" >> $GITHUB_PATH
          git config --global user.email "build@flexgram.local"
          git config --global user.name "FlexGram Build"

      - name: NuGet sources.
        run: |
          nuget sources Disable -Name "Microsoft Visual Studio Offline Packages"
          nuget sources Add -Source https://api.nuget.org/v3/index.json & exit 0

      - name: Libraries cache.
        id: cache-libs
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.TBUILD }}\Libraries
            ${{ env.TBUILD }}\Libraries64
          key: ${{ runner.OS }}-libs-k149-v1

      - name: Libraries.
        env:
          GYP_MSVS_OVERRIDE_PATH: 'C:\Program Files\Microsoft Visual Studio\2022\Enterprise\'
          GYP_MSVS_VERSION: 2022
        run: |
          C:
          cd %TBUILD%
          %REPO_NAME%/Telegram/build/prepare/win.bat skip-release silent

      - name: Free up some disk space.
        run: |
          C:
          cd %TBUILD%
          del /S Libraries\*.pdb
          del /S Libraries\*.pch
          del /S Libraries\*.obj
          del /S Libraries64\*.pdb
          del /S Libraries64\*.pch
          del /S Libraries64\*.obj

      - name: FlexGram Desktop build.
        run: |
          C:
          cd %TBUILD%\%REPO_NAME%\Telegram

          call configure.bat x64 ^
          -D TDESKTOP_API_ID=3893395 ^
          -D TDESKTOP_API_HASH=e2adbe11ee0f092ced6043c4e051fdda ^
          -D DESKTOP_APP_USE_PACKAGED=OFF ^
          -D DESKTOP_APP_DISABLE_CRASH_REPORTS=ON ^
          -D DESKTOP_APP_DISABLE_AUTOUPDATE=ON ^
          -D DESKTOP_APP_NO_PDB=ON

          cd ..\out64
          msbuild -m Telegram.sln /p:Configuration=Release,Platform=x64 /p:DebugSymbols=false /p:DebugType=none

      - name: Package.
        run: |
          C:
          mkdir artifact\FlexGram
          copy %TBUILD%\%REPO_NAME%\out64\Release\Kotatogram.exe artifact\FlexGram\FlexGram.exe
          %TBUILD%\Libraries64\Qt-5.15.2\bin\windeployqt.exe --release --no-translations --no-compiler-runtime --no-angle --no-opengl-sw artifact\FlexGram\FlexGram.exe
          copy %TBUILD%\Libraries64\local\bin\*.dll artifact\FlexGram\ 2>nul
          dir artifact\FlexGram
          powershell -Command "Compress-Archive -Path 'artifact\FlexGram\*' -DestinationPath 'artifact\FlexGram-Windows-x64.zip' -Force"

      - uses: actions/upload-artifact@v4
        name: Upload artifact.
        if: env.UPLOAD_ARTIFACT == 'true'
        with:
          name: FlexGram-Windows-x64
          path: artifact\FlexGram-Windows-x64.zip
          retention-days: 14
